<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Procurement log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDEFEA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Kept inline to prevent flash of wrong theme before CSS/JS load
    try {
      var t = localStorage.getItem("theme");
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header>
      <div>
        <h1>Procurement log</h1>
        <p class="sub mono" id="sub">offline copy</p>
      </div>
      <div class="actions">
        <button class="ib" id="th" aria-label="Toggle dark or light theme"></button>
        <button class="btn" id="exp">Copy CSV</button>
        <button class="btn" id="demo">Demo data</button>
        <button class="btn danger" id="rs">Reset</button>
        <button class="btn fill" id="new">New order</button>
      </div>
    </header>
    <nav class="tabs">
      <button class="tab on" data-v="dash">Dashboard</button>
      <button class="tab" data-v="list">Orders</button>
      <button class="tab" data-v="sup">Suppliers</button>
    </nav>
    <main id="main"></main>
    <footer class="mono">stored locally · indexeddb</footer>
  </div>

  <dialog id="dlg">
    <form method="dialog" id="frm" style="margin:0">
      <h1 id="dt">New order</h1>
      <div class="f">
        <label>Order no.<input name="po" required></label>
        <label>Order date<input name="date" type="date" required></label>
        <label>Supplier<input name="supplier" required></label>
        <label>Type<input name="type" list="types" placeholder="e.g. Raw materials"></label>
        <datalist id="types">
          <option>Raw materials</option>
          <option>Office</option>
          <option>Equipment</option>
          <option>Packaging</option>
          <option>Services</option>
        </datalist>
        <label>Ordered units<input name="units" type="number" min="1" required inputmode="numeric"></label>
        <label>Arrived units<input name="got" type="number" min="0" value="0" required inputmode="numeric"></label>
        <label>Cost (MYR)<input name="cost" type="number" min="0" step="0.01" required inputmode="decimal"></label>
        <label>Status
          <select name="status">
            <option value="pending">Pending</option>
            <option value="arrived">Arrived</option>
            <option value="completed">Completed (closed)</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </label>
        <label class="w">Expected arrival<input name="eta" type="date"></label>
        <label class="w">Note<textarea name="note" rows="2"></textarea></label>
      </div>
      <div class="dact">
        <button type="button" class="btn danger" id="del" hidden>Delete</button>
        <span style="flex:1"></span>
        <button type="button" class="btn" id="cmp" hidden>Complete order</button>
        <button type="button" class="btn" id="cx">Cancel</button>
        <button type="submit" class="btn fill">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="cfm">
    <p id="cm" style="font-size:14px;line-height:1.5"></p>
    <div class="dact">
      <span style="flex:1"></span>
      <button type="button" class="btn" id="cn">Cancel</button>
      <button type="button" class="btn fill" id="cy">Confirm</button>
    </div>
  </dialog>
  
  <div class="toast" id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
